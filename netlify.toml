[build]
  command = "npm run build"
  publish = "docs/.vitepress/dist"
  functions = "netlify/functions"

[dev]
  command = "npm run docs:dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
